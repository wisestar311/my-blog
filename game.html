<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 - My Blog</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/game.css">
<script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-title" href="index.html">My Blog</a>
      <nav class="site-nav">
        <a class="site-nav-link" href="game.html">2048</a>
        <a class="site-nav-link" href="pixel-art.html">Pixel Art</a>
        <a class="site-nav-link" href="store.html">Store</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="다크 모드 전환"></button>
    </div>
  </header>

  <main class="game-page">
    <a class="back-link" href="index.html">&larr; 목록으로</a>

    <div class="game-container">
      <div class="game-header-row">
        <h1 class="game-title">2048</h1>
        <div class="scoreboard">
          <div class="score-box" id="score-box" aria-live="polite" aria-atomic="true">
            <span class="score-label">SCORE</span>
            <span class="score-value" id="score-value">0</span>
          </div>
          <div class="score-box" id="best-box">
            <span class="score-label">BEST</span>
            <span class="score-value" id="best-value">0</span>
          </div>
        </div>
      </div>

      <div class="game-controls-row">
        <p class="game-hint">방향키, 스와이프, 또는 아래 버튼으로 타일을 움직여 합치세요.</p>
        <button id="new-game-btn" class="new-game-btn">New Game</button>
      </div>

      <div class="game-board-wrap">
        <div class="game-board" id="game-board">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div
          class="game-overlay"
          id="game-overlay"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="game-overlay-message"
          hidden
        >
          <p class="game-overlay-message" id="game-overlay-message"></p>
          <button class="new-game-btn" id="overlay-restart-btn">Try Again</button>
          <button class="game-overlay-secondary" id="overlay-keep-playing-btn" hidden>Keep Playing</button>
        </div>
      </div>

      <div class="game-dpad" role="group" aria-label="방향 조작 버튼">
        <button type="button" class="dpad-btn dpad-up" data-direction="up" aria-label="위로 밀기">&#9650;</button>
        <button type="button" class="dpad-btn dpad-left" data-direction="left" aria-label="왼쪽으로 밀기">&#9664;</button>
        <button type="button" class="dpad-btn dpad-right" data-direction="right" aria-label="오른쪽으로 밀기">&#9654;</button>
        <button type="button" class="dpad-btn dpad-down" data-direction="down" aria-label="아래로 밀기">&#9660;</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>마크다운으로 쓰고, 프레임워크 없이 보여줍니다.</p>
  </footer>

  <script src="js/game.js"></script>
  <script>BlogTheme.initThemeToggle("theme-toggle");</script>
</body>
</html>
