<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art - My Blog</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pixel-art.css">
<script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-title" href="index.html">My Blog</a>
      <nav class="site-nav">
        <a class="site-nav-link" href="game.html">2048</a>
        <a class="site-nav-link" href="pixel-art.html">Pixel Art</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="다크 모드 전환"></button>
    </div>
  </header>

  <main class="pixel-art-page">
    <a class="back-link" href="index.html">&larr; 목록으로</a>

    <div class="pixel-art-container">
      <h1 class="pixel-art-title">Pixel Art</h1>
      <p class="pixel-art-hint">캔버스를 클릭하거나 드래그해서 색을 칠하세요. 팔레트에서 색을 고르고, 지우개로 지울 수 있어요. 완성하면 Save PNG로 저장하세요.</p>

      <div class="pixel-art-workspace">
        <div class="canvas-wrap">
          <canvas id="pixel-canvas" width="512" height="512"></canvas>
        </div>

        <aside class="pixel-art-sidebar">
          <div class="palette" id="palette"></div>

          <label class="custom-color-row">
            <span>Custom</span>
            <input type="color" id="custom-color-picker" value="#00f0ff">
          </label>

          <div class="pixel-art-toolbar">
            <button id="clear-btn" class="new-game-btn">Clear</button>
            <button id="save-btn" class="new-game-btn">Save PNG</button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>마크다운으로 쓰고, 프레임워크 없이 보여줍니다.</p>
  </footer>

  <script src="js/pixel-art.js"></script>
  <script>BlogTheme.initThemeToggle("theme-toggle");</script>
</body>
</html>
